services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recap_bot_db
    environment:
      POSTGRES_USER: recap_user
      POSTGRES_PASSWORD: recap_password
      POSTGRES_DB: recap_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recap_user -d recap_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recap_network

  redis:
    image: redis:7-alpine
    container_name: recap_bot_redis
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recap_network

  # Recap Bot
  recap-bot:
    build: .
    container_name: recap_bot_app
    environment:
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN}
      DATABASE_URL: postgresql://recap_user:recap_password@postgres:5432/recap_bot
      RUST_LOG: recap_bot=debug,info
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL}
      AI_MODEL: ${AI_MODEL}
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recap_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  recap_network:
    driver: bridge
