apiVersion: apps/v1
kind: Deployment
metadata:
  name: recap-bot
  namespace: recap-bot
  labels:
    app: recap-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recap-bot
  template:
    metadata:
      labels:
        app: recap-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: recap-bot
          image: ghcr.io/limitofzero/recap-bot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: recap-bot-secrets
            - configMapRef:
                name: recap-bot-config
          env:
            - name: RUST_LOG
              value: info
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
