name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95"
  SQLX_VERSION: "0.8"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  sqlx-cache:
    name: Verify sqlx cache
    runs-on: ubuntu-latest              
    services:                            
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recap_user
          POSTGRES_PASSWORD: recap_password
          POSTGRES_DB: recap_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recap_user -d recap_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recap_user:recap_password@localhost:5432/recap_bot
    steps:                              
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^${{ env.SQLX_VERSION }} --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run

      - name: Verify sqlx cache is up-to-date
        run: cargo sqlx prepare --check -- --bin recap-bot

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, sqlx-cache]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
